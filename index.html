<!DOCTYPE html>
<html>

<head>
  <title>Bake your cake</title>
  <!-- A-Frame Core -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- A-Frame PhysX - The Physics Engine -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-physx@0.4.0/dist/aframe-physx.min.js"></script>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }

    #startScreen,
    #cakeChoices {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-size: cover;
      z-index: 10;
    }

    #startScreen {
      background: url('https://cdn.pixabay.com/photo/2015/01/14/19/20/bake-599521_1280.jpg') no-repeat center center;
    }

    #startScreen::before,
    #cakeChoices::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    #cakeChoices {
      background: url('https://cdn.pixabay.com/photo/2015/01/14/19/20/bake-599521_1280.jpg') no-repeat center center;
      display: none;
    }

    .cake-tab {
      padding: 20px;
      border-radius: 10px;
      color: white;
      font-size: 20px;
      cursor: pointer;
      text-align: center;
      width: 180px;
      font-weight: bold;
      margin: 10px;
    }

    #chocolateTab {
      background-color: #8B4B36;
    }

    #blueberryTab {
      background-color: #1E90FF;
    }

    #cherryTab {
      background-color: #FF69B4;
    }

    #recipePanel {
      position: absolute;
      top: 20%;
      left: 5%;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      display: none;
      z-index: 10;
      min-width: 200px;
      color: white;
    }

    #recipePanel h2 {
      margin-top: 0;
      font-size: 22px;
      text-align: center;
    }

    #recipePanel ul {
      list-style: none;
      padding: 0;
    }

    #recipePanel li {
      margin: 5px 0;
      font-weight: bold;
      transition: color 0.5s;
    }

    #recipePanel li.collected {
      color: lightgreen;
      text-decoration: line-through;
    }

    #recipePanel.chocolate {
      background-color: rgba(139, 69, 19, 0.8);
    }

    #recipePanel.blueberry {
      background-color: rgba(30, 144, 255, 0.8);
    }

    #recipePanel.cherry {
      background-color: rgba(255, 105, 180, 0.8);
    }
  </style>
</head>

<body>
  <div id="startScreen">
    <h1 style="color:white;">Bake your cake</h1>
    <button onclick="startGame()">Start</button>
  </div>

  <div id="cakeChoices">
    <div id="chocolateTab" class="cake-tab" onclick="chooseCake('chocolate')">Chocolate Cake</div>
    <div id="blueberryTab" class="cake-tab" onclick="chooseCake('blueberry')">Blueberry Cake</div>
    <div id="cherryTab" class="cake-tab" onclick="chooseCake('cherry')">Cherry Cake</div>
  </div>

  <div id="recipePanel"></div>

  <a-scene physx="gravity: 0 -9.8 0;" style="display:none;" embedded>
    <a-assets>
    	<a-asset-item id="backwall-model" src="backwall.glb"></a-asset-item>
        <a-asset-item id="frontwall-model" src="frontwall.glb"></a-asset-item>
        <a-asset-item id="rightwall-model" src="rightwall.glb"></a-asset-item>
        <a-asset-item id="leftwall-model" src="leftwall.glb"></a-asset-item>
        <a-asset-item id="floor-model" src="floor.glb"></a-asset-item>
        <a-asset-item id="fridge-model" src="fridge.glb"></a-asset-item>
        <a-asset-item id="roof-model" src="roof.glb"></a-asset-item>
        <a-asset-item id="counterdecor-model" src="counterdecor.glb"></a-asset-item>
        <a-asset-item id="counters-model" src="counters.glb"></a-asset-item>
        <a-asset-item id="radio-model" src="radio.glb"></a-asset-item>
        <a-asset-item id="light-model" src="light.glb"></a-asset-item>
        <a-asset-item id="shelves-model" src="shelves.glb"></a-asset-item>
        <a-asset-item id="stool-model" src="stool.glb"></a-asset-item>
        <a-asset-item id="stove-model" src="stove.glb"></a-asset-item>
        <a-asset-item id="salt-model" src="salt.glb"></a-asset-item>
        <a-asset-item id="eggcarton-model" src="eggcarton.glb"></a-asset-item>
        <a-asset-item id="cuttingboard-model" src="cuttingboard.glb"></a-asset-item>
        <a-asset-item id="knife-model" src="knife.glb"></a-asset-item>
        <a-asset-item id="vanilla-model" src="vanilla.glb"></a-asset-item>
        <a-asset-item id="strawberry-model" src="strawberry.glb"></a-asset-item>
        <a-asset-item id="spatula-model" src="spatula.glb"></a-asset-item>
        <a-asset-item id="whisk-model" src="whisk.glb"></a-asset-item>
        <a-asset-item id="banana-model" src="banana.glb"></a-asset-item>
        <a-asset-item id="mixingbowl-model" src="mixingbowl.glb"></a-asset-item>
        <a-asset-item id="chocolatecake-model" src="chocolatecake.glb"></a-asset-item>
        <a-asset-item id="blueberrycake-model" src="blueberrycake.glb"></a-asset-item>
        <a-asset-item id="cherrycake1-model" src="cherrycake1.glb"></a-asset-item>
        <a-asset-item id="cherrycake2-model" src="cherrycake2.glb"></a-asset-item>
        <a-asset-item id="cherrycake3-model" src="cherrycake3.glb"></a-asset-item>
        <a-asset-item id="cherrycake4-model" src="cherrycake4.glb"></a-asset-item>
        <a-asset-item id="flour-model" src="flour.glb"></a-asset-item>
        <a-asset-item id="sugar-model" src="sugar.glb"></a-asset-item>
        <a-asset-item id="butter-model" src="butter.glb"></a-asset-item>
        <a-asset-item id="milk-model" src="milk.glb"></a-asset-item>
        <a-asset-item id="egg-model" src="egg.glb"></a-asset-item>
        <a-asset-item id="blueberry-model" src="blueberry.glb"></a-asset-item>
        <a-asset-item id="cherries-model" src="cherries.glb"></a-asset-item>
        <a-asset-item id="chocolate-model" src="chocolate.glb"></a-asset-item>
        <a-sound id="baking-music" src="baking cooking jazz.mp3"></a-sound>
        </a-assets>
            <a-sound id="baking-music" src="baking cooking jazz.mp3"></a-sound>
        </a-assets>

	  
    <a-entity id="player-rig" position="0 1.6 5">
      <a-entity id="player-camera" camera position="0 0 0" cursor="rayOrigin: mouse;"
        raycaster="objects: .grabbable, .droppable"></a-entity>
    </a-entity>

    <!-- Mixing bowl as droppable -->
    <a-entity id="mixingbowl" gltf-model="#mixingbowl-model" position="0 0 0" class="droppable" droppable></a-entity>
	<!-- Draggable Ingredients -->
        	<a-entity id="vanilla" gltf-model="vanilla.glb" class="grabbable" data-name="vanilla"></a-entity>
        	<a-entity id="spatula" gltf-model="spatula.glb" class="grabbable" data-name="spatula"></a-entity>
        	<a-entity id="whisk" gltf-model="whisk.glb" class="grabbable" data-name="whisk"></a-entity>
        	<a-entity id="strawberry" gltf-model="strawberry.glb" class="grabbable" data-name="strawberry"></a-entity>
        	<a-entity id="banana" gltf-model="banana.glb" class="grabbable" data-name="banana"></a-entity>
        	<a-entity id="salt" gltf-model="salt.glb" class="grabbable" data-name="salt"></a-entity>
        	<a-entity id="flour" gltf-model="flour.glb" class="grabbable" data-name="flour"></a-entity>
        	<a-entity id="sugar" gltf-model="sugar.glb" class="grabbable" data-name="sugar"></a-entity>
        	<a-entity id="butter" gltf-model="butter.glb" class="grabbable" data-name="butter"></a-entity>
        	<a-entity id="milk" gltf-model="milk.glb" class="grabbable" data-name="milk"></a-entity>
        	<a-entity id="egg" gltf-model="egg.glb" class="grabbable" data-name="egg"></a-entity>
        	<a-entity id="blueberry" gltf-model="blueberry.glb" class="grabbable" data-name="blueberry"></a-entity>
        	<a-entity id="cherries" gltf-model="cherries.glb" class="grabbable" data-name="cherries"></a-entity>
        	<a-entity id="chocolate" gltf-model="chocolate.glb" class="grabbable" data-name="chocolate"></a-entity>
  </a-scene>

  <script>
    let currentIngredients = [];
    let collectedIngredients = [];
    let selectedCake = '';
    let grabbedEl = null;

    const cursor = document.querySelector('[cursor]');
    const camera = document.getElementById('player-camera');
    const mixingBowl = document.getElementById('mixingbowl');

    // Start the game UI
    function startGame() {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('cakeChoices').style.display = 'flex';
    }

    // Choose cake and show recipe
    function chooseCake(cakeName) {
      selectedCake = cakeName;
      document.getElementById('cakeChoices').style.display = 'none';
      document.querySelector('a-scene').style.display = 'block';
      const recipePanel = document.getElementById('recipePanel');
      recipePanel.style.display = 'block';
      recipePanel.className = cakeName;

      const baseIngredients = ["flour", "sugar", "butter", "milk", "egg"];
      if (cakeName === 'blueberry') {
        currentIngredients = [...baseIngredients, "blueberry"];
      } else if (cakeName === 'chocolate') {
        currentIngredients = [...baseIngredients, "chocolate"];
      } else if (cakeName === 'cherry') {
        currentIngredients = [...baseIngredients, "cherries"];
      }
      collectedIngredients = [];

      recipePanel.innerHTML = `<h2>${cakeName.charAt(0).toUpperCase() + cakeName.slice(1)} Cake</h2>` +
        `<ul>${currentIngredients.map(i => `<li id="recipe-${i}">${i}</li>`).join('')}</ul>`;
    }

    // Handling grabbing and dropping logic with "E" key
    window.addEventListener('keydown', function (e) {
      if (e.key.toLowerCase() !== 'e') return;

      if (!grabbedEl) {
        // Attempt to grab an intersected grabbable entity
        let intersected = null;
        const intersects = camera.components.raycaster.intersections;
        if (intersects.length > 0) {
          intersected = intersects.find(i => i.object.el.classList.contains('grabbable'));
          intersected = intersected ? intersected.object.el : null;
        }
        if (intersected) {
          grabbedEl = intersected;
          // Attach grabbed entity to camera and position slightly in front
          grabbedEl.object3D.position.set(0, -0.5, -1);
          camera.object3D.add(grabbedEl.object3D);
        }
      } else {
        // Try to drop the currently grabbed entity
        // Check if looking at mixing bowl
        let lookingAtBowl = false;
        const intersects = camera.components.raycaster.intersections;
        if (intersects.length > 0) {
          lookingAtBowl = intersects.some(i => i.object.el === mixingBowl);
        }
        // Remove from camera and reparent in scene or mixing bowl
        if (lookingAtBowl) {
          mixingBowl.object3D.add(grabbedEl.object3D);
          grabbedEl.object3D.position.set(0, 0.2, 0);
          markIngredientCollected(grabbedEl.getAttribute('data-name'));
        } else {
          // Drop in front of player in scene root
          document.querySelector('a-scene').object3D.add(grabbedEl.object3D);
          const camPos = camera.object3D.position;
          grabbedEl.object3D.position.set(camPos.x, camPos.y - 0.5, camPos.z - 1);
        }
        grabbedEl = null;
      }
    });

    // Mark ingredient collected and update recipe panel
    function markIngredientCollected(name) {
      if (currentIngredients.includes(name) && !collectedIngredients.includes(name)) {
        collectedIngredients.push(name);
        const li = document.getElementById('recipe-' + name);
        if (li) li.classList.add('collected');
        checkCompletion();
      }
    }

    // Check if cake is completed
    function checkCompletion() {
      const allCollected = currentIngredients.length === collectedIngredients.length &&
        currentIngredients.every(x => collectedIngredients.includes(x));
      if (allCollected) {
        alert("All ingredients collected! Cake is ready!");
        // Enhance with showing cake or next steps
      }
    }
  </script>
</body>

</html>
