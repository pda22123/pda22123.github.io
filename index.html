<!DOCTYPE html>
<html>
<head>
  <title>Bake your cake</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body, html { margin:0; padding:0; height:100%; width:100%; font-family:sans-serif; }
    #startScreen, #cakeChoices { position:absolute; top:0; left:0; width:100%; height:100%;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      background-size:cover; background-position:center; background-repeat:no-repeat;
      background-attachment:fixed; z-index:10; }
    #startScreen { background-image: url('https://cdn.pixabay.com/photo/2015/01/14/19/20/bake-599521_1280.jpg'); }
    #cakeChoices { background-image: url('https://cdn.pixabay.com/photo/2015/01/14/19/20/bake-599521_1280.jpg'); display:none; }
    #startScreen::before, #cakeChoices::before { content:""; position:absolute; top:0; left:0;
      width:100%; height:100%; background: rgba(0,0,0,0.5); z-index:-1; }
    .cake-tab { padding:20px; border-radius:10px; color:white; font-size:20px; cursor:pointer;
      text-align:center; width:180px; font-weight:bold; margin:10px; }
    #chocolateTab{background-color:#8B4513;} 
    #blueberryTab{background-color:#1E90FF;} 
    #strawberryTab{background-color:#FF69B4;} 
    #cherryTab{background-color:#c71585;}
  </style>
</head>
<body>
  <div id="startScreen">
    <h1 style="color:white;">Bake your cake</h1>
    <button onclick="startGame()">Start</button>
  </div>

  <div id="cakeChoices">
    <div id="strawberryTab" class="cake-tab" onclick="chooseCake('strawberry')">Strawberry Cake</div>
    <div id="blueberryTab" class="cake-tab" onclick="chooseCake('blueberry')">Blueberry Cake</div>
    <div id="cherryTab" class="cake-tab" onclick="chooseCake('cherry')">Cherry Cake</div>
  </div>

  <!-- === SCENE === -->
  <a-scene id="scene" style="display:block;">
    <!-- Camera fixed to eye level -->
    <a-entity position="0 2 5">
      <a-camera>
        <a-cursor rayOrigin="mouse" fuse="false" material="color:black; shader:flat"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Lights -->
    <a-entity light="type:ambient; intensity:1"></a-entity>
    <a-entity light="type:directional; intensity:1.2" position="0 4 4"></a-entity>

    <!-- Test Kitchen objects -->
    <a-entity id="floor" gltf-model="floor.glb" position="0 0 0" scale="0.1 0.1 0.1"></a-entity>
    <a-entity id="fridge" gltf-model="fridge.glb" position="-2 0 -3" scale="0.1 0.1 0.1"></a-entity>
    <a-entity id="stove" gltf-model="stove.glb" position="2 0 -3" scale="0.1 0.1 0.1"></a-entity>

    <!-- Test Collectables -->
    <a-entity id="flour" gltf-model="flour.glb" position="0 1 -2" scale="0.2 0.2 0.2"></a-entity>
    <a-entity id="sugar" gltf-model="sugar.glb" position="1 1 -2" scale="0.2 0.2 0.2"></a-entity>
    <a-entity id="butter" gltf-model="butter.glb" position="-1 1 -2" scale="0.2 0.2 0.2"></a-entity>

    <!-- Background wall for orientation -->
    <a-plane color="#ccc" height="10" width="20" rotation="-90 0 0" position="0 0 -5"></a-plane>
  </a-scene>

  <script>
    function startGame(){
      document.getElementById('startScreen').style.display='none';
      document.getElementById('cakeChoices').style.display='flex';
    }
    function chooseCake(cakeName){
      alert("You picked " + cakeName + " (functionality coming later)");
    }
  </script>
</body>
</html>
