<!DOCTYPE html>
<html>
<head>
    <title>Bake your cake</title>
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- A-Frame PhysX - The Physics Engine -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physx@0.4.0/dist/aframe-physx.min.js"></script>
    <!-- A-Frame Extras for Drag-and-Drop -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.1.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body, html { margin:0; padding:0; height:100%; width:100%; font-family:sans-serif; overflow: hidden; }
        #startScreen, #cakeChoices { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background-size:cover; z-index:10; }
        #startScreen { background: url('https://cdn.pixabay.com/photo/2015/01/14/19/20/bake-599521_1280.jpg') no-repeat center center; }
        #startScreen::before, #cakeChoices::before { content:""; position:absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index:-1; }
        #cakeChoices { background: url('https://cdn.pixabay.com/photo/2015/01/14/19/20/bake-599521_1280.jpg') no-repeat center center; display:none; }
        .cake-tab { padding:20px; border-radius:10px; color:white; font-size:20px; cursor:pointer; text-align:center; width:180px; font-weight:bold; margin:10px; }
        #chocolateTab{background-color:#8B4B36;} #blueberryTab{background-color:#1E90FF;} #cherryTab{background-color:#FF69B4;}
        #recipePanel { position:absolute; top:20%; left:5%; padding:20px; border-radius:12px; font-size:18px; display:none; z-index:10; min-width:200px; color:white; }
        #recipePanel h2 { margin-top:0; font-size:22px; text-align:center; }
        #recipePanel ul { list-style:none; padding:0; }
        #recipePanel li { margin:5px 0; font-weight:bold; transition: color 0.5s; }
        #recipePanel li.collected { color:lightgreen; text-decoration: line-through; }
        #recipePanel.chocolate { background-color: rgba(139, 69, 19, 0.8); }
        #recipePanel.blueberry { background-color: rgba(30, 144, 255, 0.8); }
        #recipePanel.cherry { background-color: rgba(255, 105, 180, 0.8); }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1 style="color:white;">Bake your cake</h1>
        <button onclick="startGame()">Start</button>
    </div>

    <div id="cakeChoices">
        <div id="chocolateTab" class="cake-tab" onclick="chooseCake('chocolate')">Chocolate Cake</div>
        <div id="blueberryTab" class="cake-tab" onclick="chooseCake('blueberry')">Blueberry Cake</div>
        <div id="cherryTab" class="cake-tab" onclick="chooseCake('cherry')">Cherry Cake</div>
    </div>

    <div id="recipePanel"></div>

    <!-- Initialize the scene with the PhysX engine -->
    <a-scene id="scene" physx="gravity: 0 -9.8 0;" style="display:none;" cursor="rayOrigin: mouse; fuse: false">
        <!-- Asset management system. All assets (models, sounds) are pre-loaded here. -->
        <a-assets>
            <a-asset-item id="backwall-model" src="backwall.glb"></a-asset-item>
            <a-asset-item id="frontwall-model" src="frontwall.glb"></a-asset-item>
            <a-asset-item id="rightwall-model" src="rightwall.glb"></a-asset-item>
            <a-asset-item id="leftwall-model" src="leftwall.glb"></a-asset-item>
            <a-asset-item id="floor-model" src="floor.glb"></a-asset-item>
            <a-asset-item id="fridge-model" src="fridge.glb"></a-asset-item>
            <a-asset-item id="roof-model" src="roof.glb"></a-asset-item>
            <a-asset-item id="counterdecor-model" src="counterdecor.glb"></a-asset-item>
            <a-asset-item id="counters-model" src="counters.glb"></a-asset-item>
            <a-asset-item id="radio-model" src="radio.glb"></a-asset-item>
            <a-asset-item id="light-model" src="light.glb"></a-asset-item>
            <a-asset-item id="shelves-model" src="shelves.glb"></a-asset-item>
            <a-asset-item id="stool-model" src="stool.glb"></a-asset-item>
            <a-asset-item id="stove-model" src="stove.glb"></a-asset-item>
            <a-asset-item id="salt-model" src="salt.glb"></a-asset-item>
            <a-asset-item id="eggcarton-model" src="eggcarton.glb"></a-asset-item>
            <a-asset-item id="cuttingboard-model" src="cuttingboard.glb"></a-asset-item>
            <a-asset-item id="knife-model" src="knife.glb"></a-asset-item>
            <a-asset-item id="vanilla-model" src="vanilla.glb"></a-asset-item>
            <a-asset-item id="strawberry-model" src="strawberry.glb"></a-asset-item>
            <a-asset-item id="spatula-model" src="spatula.glb"></a-asset-item>
            <a-asset-item id="whisk-model" src="whisk.glb"></a-asset-item>
            <a-asset-item id="banana-model" src="banana.glb"></a-asset-item>
            <a-asset-item id="mixingbowl-model" src="mixingbowl.glb"></a-asset-item>
            <a-asset-item id="chocolatecake-model" src="chocolatecake.glb"></a-asset-item>
            <a-asset-item id="blueberrycake-model" src="blueberrycake.glb"></a-asset-item>
            <a-asset-item id="cherrycake1-model" src="cherrycake1.glb"></a-asset-item>
            <a-asset-item id="cherrycake2-model" src="cherrycake2.glb"></a-asset-item>
            <a-asset-item id="cherrycake3-model" src="cherrycake3.glb"></a-asset-item>
            <a-asset-item id="cherrycake4-model" src="cherrycake4.glb"></a-asset-item>
            <a-asset-item id="baking-music" src="baking cooking jazz.mp3"></a-asset-item>
        </a-assets>

        <!-- Player Rig with PhysX for collision -->
        <a-entity id="player-rig"
                  position="0 45 5"
                  wasd-controls="acceleration: 100;"
                  look-controls
                  physx-body="type: kinematic; height: 1.6; radius: 0.5;"
                  physx-shape="type: capsule; fit: manual; height: 1.6; radius: 0.5;">
            <!-- The camera is the player's eyes -->
            <a-entity id="player-camera" camera position="0 0 0"></a-entity>
        </a-entity>

        <!-- Lights -->
        <a-entity light="type:ambient; intensity:0.5"></a-entity>
        <a-entity light="type:directional; intensity:0.8" position="0 2 1"></a-entity>

        <!-- Invisible physical floor that objects will fall onto -->
        <a-plane id="physical-floor" position="0 0 0" rotation="-90 0 0" width="50" height="50" visible="false"
                 physx-body="type: static;"
                 physx-shape="type: plane;">
        </a-plane>

        <!-- Kitchen Fixtures with PhysX bodies for collision -->
        <a-entity id="backwall" gltf-model="backwall.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="frontwall" gltf-model="frontwall.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="rightwall" gltf-model="rightwall.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="leftwall" gltf-model="leftwall.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="floor" gltf-model="floor.glb"></a-entity>
        <a-entity id="fridge" gltf-model="fridge.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="roof" gltf-model="roof.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="counterdecor" gltf-model="counterdecor.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="counters" gltf-model="counters.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="radio" gltf-model="radio.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="light" gltf-model="light.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="shelves" gltf-model="shelves.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="stool" gltf-model="stool.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="stove" gltf-model="stove.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="eggcarton" gltf-model="eggcarton.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="cuttingboard" gltf-model="cuttingboard.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
        <a-entity id="knife" gltf-model="knife.glb" physx-body="type: static;" physx-shape="type: box;"></a-entity>
       
        <a-entity id="mixingbowl" gltf-model="#mixingbowl-model" droppable physx-body="type: static;" physx-shape="type: cylinder;"></a-entity>

        <!-- Draggable Ingredients -->
         <a-entity id="vanilla" gltf-model="vanilla.glb" class="ingredient" draggable data-name="vanilla" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="spatula" gltf-model="spatula.glb" class="ingredient" draggable data-name="spatula" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="whisk" gltf-model="whisk.glb" class="ingredient" draggable data-name="whisk" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="strawberry" gltf-model="strawberry.glb" class="ingredient" draggable data-name="banana" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="banana" gltf-model="banana.glb" class="ingredient" draggable data-name="banana" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="salt" gltf-model="salt.glb" class="ingredient" draggable data-name="salt" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="flour" gltf-model="flour.glb" class="ingredient" draggable data-name="flour" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="sugar" gltf-model="sugar.glb" class="ingredient" draggable data-name="sugar" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="butter" gltf-model="butter.glb" class="ingredient" draggable data-name="butter" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="milk" gltf-model="milk.glb" class="ingredient" draggable data-name="milk" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        <a-entity id="egg" gltf-model="egg.glb" class="ingredient" draggable data-name="egg" physx-body="type: dynamic;" physx-shape="type: sphere; radius: 0.04;"></a-entity>
        <a-entity id="blueberry" gltf-model="blueberry.glb" class="ingredient" draggable data-name="blueberry" physx-body="type: dynamic;" physx-shape="type: sphere; radius: 0.03;"></a-entity>
        <a-entity id="cherries" gltf-model="cherries.glb" class="ingredient" draggable data-name="cherries" physx-body="type: dynamic;" physx-shape="type: sphere; radius: 0.03;"></a-entity>
        <a-entity id="chocolate" gltf-model="chocolate.glb" class="ingredient" draggable data-name="chocolate" physx-body="type: dynamic;" physx-shape="type: box;"></a-entity>
        
        <!-- Final Cake Container - position attribute removed and model names updated -->
        <a-entity id="final-cake-container" visible="false">
            <a-entity id="strawberrycake" gltf-model="strawberrycake.glb" visible="false"></a-entity>
            <a-entity id="blueberrycake" gltf-model="blueberrycake.glb" visible="false"></a-entity>
            <a-entity id="cherrycake1" gltf-model="cherrycake1.glb" visible="false"></a-entity>
            <a-entity id="cherrycake2" gltf-model="cherrycake2.glb" visible="false"></a-entity>
            <a-entity id="cherrycake3" gltf-model="cherrycake3.glb" visible="false"></a-entity>
            <a-entity id="cherrycake4" gltf-model="cherrycake4.glb" visible="false"></a-entity>
        </a-entity>

        <a-sound id="mainmusic" src="baking cooking jazz.mp3" autoplay="false" loop="true"></a-sound>
    </a-scene>

    <script>
        let currentIngredients = [];
        let collectedIngredients = [];
        let selectedCake = '';

        AFRAME.registerComponent('draggable', {
            init: function () {
                this.el.classList.add('clickable');
            }
        });

        AFRAME.registerComponent('droppable', {
            init: function () {
                this.el.addEventListener('drag-drop', (e) => {
                    const droppedEl = e.detail.dropped;
                    const ingredientName = droppedEl.getAttribute('data-name');
                    
                    if (currentIngredients.includes(ingredientName) && !collectedIngredients.includes(ingredientName)) {
                        collectedIngredients.push(ingredientName);
                        
                        const li = document.getElementById(`recipe-${ingredientName}`);
                        if(li) {
                            li.classList.add('collected');
                        }

                        const bowlPosition = this.el.getAttribute('position');
                        droppedEl.setAttribute('animation', {
                            property: 'position',
                            to: `${bowlPosition.x} ${bowlPosition.y + 0.2} ${bowlPosition.z}`,
                            dur: 500,
                            easing: 'easeInQuad'
                        });
                        setTimeout(() => { droppedEl.setAttribute('visible', 'false'); }, 500);
                        
                        checkCompletion();
                    }
                });
            }
        });

        function startGame(){
            document.getElementById('startScreen').style.display='none';
            document.getElementById('cakeChoices').style.display='flex';
            const music = document.querySelector('#mainmusic');
            if(music && music.components.sound && !music.components.sound.isPlaying){
                music.components.sound.playSound();
            }
        }

        function chooseCake(cakeName){
            selectedCake = cakeName;
            document.getElementById('cakeChoices').style.display='none';
            document.getElementById('scene').style.display='block';
            const recipePanel = document.getElementById('recipePanel');
            recipePanel.style.display='block';
            recipePanel.className = cakeName;
            const baseIngredients = ["flour", "sugar", "butter", "milk", "egg"];
            if(cakeName === 'blueberry'){
                currentIngredients = [...baseIngredients, "blueberry"];
            } else if(cakeName === 'chocolate'){
                currentIngredients = [...baseIngredients, "chocolate"];
            } else if(cakeName === 'cherry'){
                currentIngredients = [...baseIngredients, "cherries"];
            }
            recipePanel.innerHTML = `<h2>${cakeName.charAt(0).toUpperCase() + cakeName.slice(1)} Cake</h2>
                <ul>${currentIngredients.map(i => `<li id="recipe-${i}">${i}</li>`).join('')}</ul>`;
        }

        function checkCompletion() {
            const allCollected = currentIngredients.length === collectedIngredients.length && 
                                 currentIngredients.every(item => collectedIngredients.includes(item));
            if (allCollected) {
                setTimeout(showFinalCake, 1000);
            }
        }

        function showFinalCake() {
            const ingredientsToHide = document.querySelectorAll('.ingredient');
            ingredientsToHide.forEach(ing => {
                if (currentIngredients.includes(ing.dataset.name)) {
                    ing.setAttribute('animation__fade', { property: 'components.material.material.opacity', to: 0, dur: 1500 });
                }
            });
            document.getElementById('mixingbowl').setAttribute('animation__fade', { property: 'components.material.material.opacity', to: 0, dur: 1500 });
            const bowl = document.getElementById('mixingbowl');
            const finalCakeContainer = document.getElementById('final-cake-container');
            finalCakeContainer.setAttribute('position', bowl.getAttribute('position'));
            
            // Handle the different cake models based on selection
            if (selectedCake === 'chocolate') {
                const cakeModel = document.getElementById('chocolate-cake-model');
                cakeModel.setAttribute('visible', 'true');
            } else if (selectedCake === 'blueberry') {
                const cakeModel = document.getElementById('blueberry-cake-model');
                cakeModel.setAttribute('visible', 'true');
            } else if (selectedCake === 'cherry') {
                document.getElementById('cherry-cake-model1').setAttribute('visible', 'true');
                document.getElementById('cherry-cake-model2').setAttribute('visible', 'true');
                document.getElementById('cherry-cake-model3').setAttribute('visible', 'true');
                document.getElementById('cherry-cake-model4').setAttribute('visible', 'true');
            }

            finalCakeContainer.setAttribute('visible', 'true');
            finalCakeContainer.setAttribute('animation', { property: 'scale', from: '0.01 0.01 0.01', to: '1 1 1', dur: 1500, easing: 'easeOutElastic' });
        }
    </script>
</body>
</html>
